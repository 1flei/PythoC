name: Diag

on:
  pull_request:
    branches: [master, main]

jobs:
  errno-probe:
    name: Errno probe on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Probe errno across the resolve path
        env:
          PYTHONPATH: .
        run: |
          python - <<'PYEOF'
          import ctypes, subprocess, os, sys
          libc = ctypes.CDLL(None)
          err = libc.__errno_location
          err.restype = ctypes.POINTER(ctypes.c_int)
          def show(tag):
              print(tag, 'errno =', err().contents.value, flush=True)
          err().contents.value = 0
          subprocess.run(['/usr/bin/true'], capture_output=True)
          show('subprocess.run(true, capture)')
          err().contents.value = 0
          subprocess.run(['cc', '--version'], capture_output=True)
          show('subprocess.run(cc --version, capture)')
          err().contents.value = 0
          subprocess.run(['/usr/bin/true'])
          show('subprocess.run(true, no capture)')
          err().contents.value = 0
          os.path.exists('/definitely/missing')
          show('os.path.exists miss')
          err().contents.value = 0
          ctypes.CDLL('libc.so.6')
          show('ctypes.CDLL')
          from pythoc import compile, i32
          from pythoc.libc.errno import __errno_location
          @compile
          def read_errno() -> i32:
              return __errno_location()[0]
          show('after pythoc import')
          err().contents.value = 0
          show('before first call (reset)')
          r = read_errno()
          print('kernel observed on first call:', r, flush=True)
          show('after first call')
          err().contents.value = 7
          r = read_errno()
          print('kernel observed on second call (pre=7):', r, flush=True)
          show('after second call')
          PYEOF
