name: Diag

on:
  pull_request:
    branches: [master, main]

jobs:
  errno-probe:
    name: Errno probe on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Probe errno under strace
        env:
          PYTHONPATH: .
        run: |
          strace -f -tt -e trace=read,write,openat,fcntl,flock,futex,epoll_wait,epoll_ctl,newfstatat,statx,access,readlink,ioctl,getrandom,prlimit64,wait4,waitid,pipe2,dup2,close,mmap,mprotect,munmap,brk,clone python .github/errno_probe.py 2>&1 | grep -E "EAGAIN|\[probe\]" | tail -60
