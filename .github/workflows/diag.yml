name: Diag

on:
  pull_request:
    branches: [master, main]

jobs:
  errno-probe:
    name: Errno probe on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Probe errno across the resolve path
        env:
          PYTHONPATH: .
        run: python .github/errno_probe.py
